name: MasterClass
description: 'MasterClass is an online education streaming platform where members
  learn from a roster of 200+ world-renowned instructors across categories including
  Arts & Entertainment, Business, Design & Style, Sports & Gaming, Writing, Food, Music,
  Science & Tech, Home & Lifestyle, Community & Government, and Wellness. Content is
  delivered as video lessons with downloadable workbooks on web, iOS, Android, Apple
  TV, Roku, and Amazon Fire TV under Standard, Plus, and Premium membership plans.
  Newer offerings include MasterClass at Work, MasterClass On Call, and the AI-native
  MasterClass Executive program. Founded by David Rogier; backed by Atomico, Bloomberg
  Beta, and IVP. MasterClass exposes no public developer API — it is a consumer
  edtech product, not an API provider.'
